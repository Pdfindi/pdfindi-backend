    <!-- Open Graph -->
    <meta property="og:type" content="website">

    <meta property="og:title" content="PDFIndi Blog - PDF Guides, Tips & Tutorials">
    <meta property="og:description" content="Discover useful guides, tips, and tutorials about managing, converting, and editing PDF files.">
    <meta property="og:image" content="https://pdfindi.com/og-image.png">
    
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f97316">
    <link rel="icon" type="image/svg+xml" href="favicon-pi.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="modern-header.min.css">
    
    <style>
        body { padding-top: 80px; background-color: #f8fafc; }
        .blog-hero {
            background: linear-gradient(135deg, #FFF5F0 0%, #FFE5DC 100%);
            color: #1F2937;
            padding: 4rem 2rem;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 3rem;
            border: 1px solid #E5E7EB;
        }
        .blog-hero h1 { font-size: 3rem; margin-bottom: 1rem; color: #0f172a; }
        .blog-hero p { font-size: 1.2rem; max-width: 600px; margin: 0 auto; color: #475569; }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }
        
        .blog-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }
        
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #f97316;
        }
        
        .blog-thumbnail {
            height: 200px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #94a3b8;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .blog-content {
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .blog-category {
            color: #f97316;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        
        .blog-title {
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        
        .blog-excerpt {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        
        .blog-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #f1f5f9;
            padding-top: 1.25rem;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        
        .read-more {
            color: #f97316;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        @media (max-width: 768px) {
            .blog-hero h1 { font-size: 2.2rem; }
            .blog-hero { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WWZRMF4W"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
        
        <div class="blog-hero">
            <h1>PDFIndi Blog & Resources</h1>
            <p>Master your document workflow with our expert guides, tips, and step-by-step tutorials.</p>
        </div>
        
        <div class="blog-grid" id="blogGrid">
            <!-- Loading State -->
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">
                <p>Loading the latest guides...</p>
            </div>
        </div>
    </div>
    
    <script>
        async function loadBlogs() {
            const grid = document.getElementById('blogGrid');
            try {
                const response = await fetch('/api/data/blog');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    grid.innerHTML = '';
                    result.data.forEach(blog => {
                        const card = document.createElement('a');
                        card.href = blog.originalFile || '#';
                        card.className = 'blog-card';
                        
                        // Default emojis based on title/slug if thumbnail not present
                        let emoji = '📄';
                        if (blog.slug?.includes('jpg')) emoji = '🖼️ ➡️ 📄';
                        if (blog.slug?.includes('word')) emoji = '📄 ➡️ 📝';
                        if (blog.slug?.includes('merge')) emoji = '📂 ➡️ 📑';
                        if (blog.slug?.includes('compress')) emoji = '📉 ➡️ 📑';

                        card.innerHTML = `
                            <div class="blog-thumbnail">${emoji}</div>
                            <div class="blog-content">
                                <div class="blog-category">${blog.category || 'Guide'}</div>
                                <h2 class="blog-title">${blog.title}</h2>
                                <p class="blog-excerpt">${blog.summary || blog.content?.substring(0, 150) + '...' || ''}</p>
                                <div class="blog-meta">
                                    <span>${blog.readTime || '5 Min Read'}</span>
                                    <span class="read-more">Read Article →</span>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;"><p>No blog posts found.</p></div>';
                }
            } catch (err) {
                console.error('Error loading blogs:', err);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #ef4444;"><p>Error loading blogs. Please try again later.</p></div>';
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadBlogs);
    </script>

    </div>
    
    <script src="modern-header.min.js" defer></script>
    <script src="script.min.js" defer></script>
</body>
</html>
