    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --error-gradient: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --shadow-light: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-medium: 0 8px 32px rgba(0,0,0,0.12);
            --shadow-strong: 0 16px 64px rgba(0,0,0,0.16);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .tool-page {
            max-width: 1200px;
            margin: 0.5rem auto 2rem;
            padding: 0;
            background: transparent;
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        /* Enhanced Back Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0.5rem auto 2rem;
            padding: 0.75rem 1.5rem;
            background: var(--glass-bg);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-light);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transition: var(--transition);
        }

        .back-btn:hover::before {
            left: 100%;
        }

        .back-btn:hover {
            color: #4f46e5;
            background: rgba(255, 255, 255, 0.98);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        /* Modern Tool Header */
        .tool-header {
            text-align: center;
            padding: 1.5rem 2rem 1rem;
            background: var(--primary-gradient);
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Tool title inside upload zone */
        .tool-title-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(229, 62, 62, 0.15);
        }
        
        .tool-icon-inline {
            font-size: 2.5rem;
            line-height: 1;
            flex-shrink: 0;
        }
        
        .tool-title-inline {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            color: #1f2937;
            text-align: center;
        }
        
        .tool-desc-inline {
            font-size: 0.9rem;
            color: #6b7280;
            margin: 0.25rem 0 0 0;
            text-align: center;
        }
        
        /* Modern Tool Header - HIDDEN */
        .tool-header {
            display: none;
        }
        
        /* Back button - HIDDEN */
        .back-btn {
            display: none;
        }

        .tool-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(180deg); }
        }

        .tool-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: bounce-in 0.8s ease-out;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        @keyframes bounce-in {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(-90deg); opacity: 0.5; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .tool-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: -0.02em;
        }

        .beta-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-left: 0.5rem;
            vertical-align: middle;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.05); }
        }

        .tool-header p {
            font-size: 1rem;
            font-weight: 400;
            margin: 0;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Main Content */
        .main-content {
            padding: 2rem;
        }

        /* Upload Section */
        .upload-section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-light);
        }

        .upload-zone {
            border: 3px dashed rgba(99, 102, 241, 0.3);
            border-radius: var(--border-radius);
            padding: 2rem 1.5rem;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--primary-gradient);
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .upload-zone:hover {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.98);
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .upload-zone:hover::before {
            opacity: 0.05;
        }

        .upload-zone.dragover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .upload-zone.dragover::before {
            opacity: 0.1;
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }

        .upload-icon {
            font-size: 3rem;
            color: #6366f1;
            margin-bottom: 1.5rem;
            transition: var(--transition);
            filter: drop-shadow(0 2px 4px rgba(99, 102, 241, 0.2));
        }

        .upload-zone:hover .upload-icon {
            transform: scale(1.1) rotate(5deg);
            color: #4f46e5;
        }

        .upload-zone h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: #1f2937;
        }

        .upload-zone p {
            font-size: 1rem;
            color: #6b7280;
            margin: 0;
            font-weight: 500;
        }

        /* Editor Container */
        .editor-container {
            display: none;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-light);
            overflow: hidden;
        }

        /* Toolbar */
        .editor-toolbar {
            background: var(--primary-gradient);
            padding: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .toolbar-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .toolbar-btn.active {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Canvas Container */
        .canvas-container {
            position: relative;
            background: white;
            min-height: 600px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .pdf-canvas {
            box-shadow: var(--shadow-light);
            border-radius: 8px;
            margin: 2rem 0;
        }

        /* Text Editor */
        .text-editor {
            position: absolute;
            background: white;
            border: 2px solid #6366f1;
            border-radius: 8px;
            padding: 0.5rem;
            min-width: 200px;
            box-shadow: var(--shadow-medium);
            display: none;
            z-index: 1000;
        }

        .text-editor textarea {
            width: 100%;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            min-height: 60px;
        }

        .text-editor .editor-controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            justify-content: flex-end;
        }

        .text-editor-btn {
            padding: 0.25rem 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .text-editor-btn.save {
            background: #10b981;
            color: white;
        }

        .text-editor-btn.cancel {
            background: #fa7220;
            color: white;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            padding: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-medium);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-strong);
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: #6366f1;
            border: 1px solid rgba(99, 102, 241, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.98);
            transform: translateY(-2px);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loading-content {
            background: var(--glass-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: var(--shadow-strong);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .tool-header h1 {
                font-size: 2rem;
            }
            
            .editor-toolbar {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .toolbar-group {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .upload-zone {
                padding: 2rem 1rem;
            }
        }

        /* Hide scrollbar but keep functionality */
        .canvas-container::-webkit-scrollbar {
            width: 8px;
        }

        .canvas-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        .canvas-container::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .canvas-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.5);
        }

        /* OCR Editable Text Boxes */
        .ocr-text-container {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 500;
        }

        .editable-text-box {
            position: absolute;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid #6366f1;
            border-radius: 8px;
            padding: 4px;
            box-shadow: var(--shadow-medium);
            pointer-events: auto;
            cursor: move;
            min-width: 100px;
            min-height: 30px;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .editable-text-box:hover {
            border-color: #4f46e5;
            transform: scale(1.02);
        }

        .editable-text-box.selected {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .editable-text-input {
                width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #1f2937;
            resize: none;
            min-height: 20px;
        }

        .editable-text-controls {
            position: absolute;
            top: -30px;
            left: 0;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: var(--transition);
        }

        .editable-text-box:hover .editable-text-controls {
            opacity: 1;
        }

        .text-control-btn {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #6366f1;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .text-control-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .confidence-indicator {
            position: absolute;
            bottom: -20px;
            right: 0;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0.8;
        }

        .confidence-high {
            background: #10b981;
            color: white;
        }

        .confidence-medium {
            background: #f59e0b;
            color: white;
        }

        .confidence-low {
            background: #fa7220;
            color: white;
        }
    </style>

                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="zoomIn" title="Zoom In">
                            <span>🔍</span> +
                        </button>
                        <span id="zoomLevel">100%</span>
                        <button class="toolbar-btn" id="zoomOut" title="Zoom Out">
                            <span>🔍</span> -
                        </button>
                        <button class="toolbar-btn" id="fitToPage" title="Fit to Page">
                            <span>📐</span> Fit
                        </button>
            </div>
            </div>

                <!-- Canvas Container -->
                <div class="canvas-container" id="canvasContainer">
                    <!-- PDF pages will be rendered here -->
            </div>
        </div>

            <!-- Text Editor (hidden by default) -->
            <div class="text-editor" id="textEditor">
                <textarea placeholder="Enter your text here..."></textarea>
                <div class="editor-controls">
                    <button class="text-editor-btn cancel">Cancel</button>
                    <button class="text-editor-btn save">Save Text</button>
            </div>
        </div>

            <!-- OCR Editable Text Boxes Container -->
            <div class="ocr-text-container" id="ocrTextContainer"></div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-secondary" id="downloadBtn" style="display: none;">
                    <span>📥</span> Download Edited PDF
                </button>
                <button class="btn btn-primary" id="resetBtn" style="display: none;">
                    <span>🔄</span> Start Over
                </button>
                </div>
            </div>
        </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <h3 id="loadingText">Loading PDF...</h3>
            <p id="loadingSubtext">Please wait while we prepare your document for editing</p>
        </div>
    </div>

    <script>
        // Global variables
        let pdfDoc = null;
        let currentPage = 1;
        let scale = 1.5;
        let pdfCanvas = null;
        let pdfContext = null;
        let textElements = [];
        let imageElements = [];
        let drawingElements = [];
        let undoStack = [];
        let redoStack = [];
        let currentTool = null;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let ocrTextBlocks = [];
        let editableTextBoxes = [];
        let isOcrMode = false;

        // DOM elements
        const uploadZone = document.getElementById('uploadZone');
        const pdfInput = document.getElementById('pdfInput');
        const editorContainer = document.getElementById('editorContainer');
        const canvasContainer = document.getElementById('canvasContainer');
        const textEditor = document.getElementById('textEditor');
        const textEditorTextarea = textEditor.querySelector('textarea');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const loadingSubtext = document.getElementById('loadingSubtext');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const zoomLevel = document.getElementById('zoomLevel');

        // Toolbar buttons
        const textTool = document.getElementById('textTool');
        const imageTool = document.getElementById('imageTool');
        const drawTool = document.getElementById('drawTool');
        const highlightTool = document.getElementById('highlightTool');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        const fitToPage = document.getElementById('fitToPage');
        const ocrTool = document.getElementById('ocrTool');
        const ocrTextContainer = document.getElementById('ocrTextContainer');

        // Initialize PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Event listeners
        uploadZone.addEventListener('click', () => pdfInput.click());
        uploadZone.addEventListener('dragover', handleDragOver);
        uploadZone.addEventListener('drop', handleDrop);
        pdfInput.addEventListener('change', handleFileSelect);

        // Toolbar event listeners
        textTool.addEventListener('click', () => selectTool('text'));
        imageTool.addEventListener('click', () => selectTool('image'));
        drawTool.addEventListener('click', () => selectTool('draw'));
        highlightTool.addEventListener('click', () => selectTool('highlight'));
        ocrTool.addEventListener('click', () => extractTextWithOCR());
        
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);
        
        zoomIn.addEventListener('click', () => changeZoom(0.25));
        zoomOut.addEventListener('click', () => changeZoom(-0.25));
        fitToPage.addEventListener('click', fitToPageView);

        // Text editor event listeners
        textEditor.querySelector('.save').addEventListener('click', saveText);
        textEditor.querySelector('.cancel').addEventListener('click', cancelTextEdit);

        // Action buttons
        downloadBtn.addEventListener('click', downloadEditedPDF);
        resetBtn.addEventListener('click', resetEditor);

        // Functions
        function handleDragOver(e) {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                handleFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                handleFile(file);
            }
        }

        function handleFile(file) {
            showLoading('Loading PDF...');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                loadPDF(new Uint8Array(e.target.result));
            };
            reader.readAsArrayBuffer(file);
        }

        async function loadPDF(data) {
            try {
                loadingText.textContent = 'Parsing PDF...';
                
                const loadingTask = pdfjsLib.getDocument({data: data});
                pdfDoc = await loadingTask.promise;
                
                loadingText.textContent = 'Rendering pages...';
                
                // Hide upload section and show editor
                document.querySelector('.upload-section').style.display = 'none';
                editorContainer.style.display = 'block';
                downloadBtn.style.display = 'inline-flex';
                resetBtn.style.display = 'inline-flex';
                
                // Render first page
                await renderPage(1);
                
                hideLoading();
                
            } catch (error) {
                console.error('Error loading PDF:', error);
                hideLoading();
                alert('Error loading PDF. Please try again.');
            }
        }

        async function renderPage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            
            // Calculate canvas size
            const viewport = page.getViewport({scale: scale});
            
            // Create canvas
            pdfCanvas = document.createElement('canvas');
            pdfContext = pdfCanvas.getContext('2d');
            
            pdfCanvas.height = viewport.height;
            pdfCanvas.width = viewport.width;
            pdfCanvas.className = 'pdf-canvas';
            
            // Clear canvas container
            canvasContainer.innerHTML = '';
            canvasContainer.appendChild(pdfCanvas);
            
            // Render PDF page
            const renderContext = {
                canvasContext: pdfContext,
                viewport: viewport
            };
            
            await page.render(renderContext).promise;
            
            // Add event listeners for interaction
            pdfCanvas.addEventListener('click', handleCanvasClick);
            pdfCanvas.addEventListener('mousedown', handleMouseDown);
            pdfCanvas.addEventListener('mousemove', handleMouseMove);
            pdfCanvas.addEventListener('mouseup', handleMouseUp);
        }

        function selectTool(tool) {
            // Remove active class from all tools
            [textTool, imageTool, drawTool, highlightTool].forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Add active class to selected tool
            if (tool === 'text') textTool.classList.add('active');
            else if (tool === 'image') imageTool.classList.add('active');
            else if (tool === 'draw') drawTool.classList.add('active');
            else if (tool === 'highlight') highlightTool.classList.add('active');
            
            currentTool = tool;
            pdfCanvas.style.cursor = tool === 'text' ? 'text' : 'crosshair';
        }

        function handleCanvasClick(e) {
            const rect = pdfCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (currentTool === 'text') {
                showTextEditor(x, y);
            } else if (currentTool === 'image') {
                addImageAtPosition(x, y);
            }
        }

        function showTextEditor(x, y) {
            textEditor.style.left = x + 'px';
            textEditor.style.top = y + 'px';
            textEditor.style.display = 'block';
            textEditorTextarea.focus();
        }

        function saveText() {
            const text = textEditorTextarea.value;
            if (text.trim()) {
                const rect = textEditor.getBoundingClientRect();
                const canvasRect = pdfCanvas.getBoundingClientRect();
                
                const x = rect.left - canvasRect.left;
                const y = rect.top - canvasRect.top;
                
                // Draw text on canvas
                pdfContext.font = '16px Inter';
                pdfContext.fillStyle = '#000000';
                pdfContext.fillText(text, x, y + 20);
                
                // Store text element for undo functionality
                textElements.push({
                    text: text,
                    x: x,
                    y: y + 20,
                    font: '16px Inter',
                    color: '#000000'
                });
                
                undoStack.push({type: 'text', data: textElements[textElements.length - 1]});
            }
            
            textEditor.style.display = 'none';
            textEditorTextarea.value = '';
        }

        function cancelTextEdit() {
            textEditor.style.display = 'none';
            textEditorTextarea.value = '';
        }

        function addImageAtPosition(x, y) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            // Scale image to reasonable size
                            const maxWidth = 200;
                            const maxHeight = 200;
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > maxWidth) {
                                height = (height * maxWidth) / width;
                                width = maxWidth;
                            }
                            if (height > maxHeight) {
                                width = (width * maxHeight) / height;
                                height = maxHeight;
                            }
                            
                            // Draw image on canvas
                            pdfContext.drawImage(img, x, y, width, height);
                            
                            // Store image element
                            imageElements.push({
                                img: img,
                                x: x,
                                y: y,
                                width: width,
                                height: height
                            });
                            
                            undoStack.push({type: 'image', data: imageElements[imageElements.length - 1]});
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function handleMouseDown(e) {
            if (currentTool === 'draw' || currentTool === 'highlight') {
                isDrawing = true;
                const rect = pdfCanvas.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
                
                pdfContext.beginPath();
                pdfContext.moveTo(lastX, lastY);
                
                if (currentTool === 'highlight') {
                    pdfContext.globalCompositeOperation = 'multiply';
                    pdfContext.strokeStyle = 'rgba(255, 255, 0, 0.5)';
                    pdfContext.lineWidth = 20;
                } else {
                    pdfContext.strokeStyle = '#000000';
                    pdfContext.lineWidth = 2;
                }
            }
        }

        function handleMouseMove(e) {
            if (isDrawing) {
                const rect = pdfCanvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                pdfContext.lineTo(x, y);
                pdfContext.stroke();
                
                lastX = x;
                lastY = y;
            }
        }

        function handleMouseUp(e) {
            if (isDrawing) {
                isDrawing = false;
                pdfContext.closePath();
                pdfContext.globalCompositeOperation = 'source-over';
                
                // Store drawing element
                drawingElements.push({
                    type: currentTool,
                    points: [] // In a real implementation, you'd store the drawing path
                });
                
                undoStack.push({type: 'drawing', data: drawingElements[drawingElements.length - 1]});
            }
        }

        function undo() {
            if (undoStack.length > 0) {
                const action = undoStack.pop();
                redoStack.push(action);
                
                // Re-render the page to remove the last action
                renderPage(currentPage);
                
                // Re-apply all remaining elements
                redrawElements();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const action = redoStack.pop();
                undoStack.push(action);
                
                // Re-apply the redone action
                redrawElements();
            }
        }

        function redrawElements() {
            // Re-draw all text elements
            textElements.forEach(element => {
                pdfContext.font = element.font;
                pdfContext.fillStyle = element.color;
                pdfContext.fillText(element.text, element.x, element.y);
            });
            
            // Re-draw all image elements
            imageElements.forEach(element => {
                pdfContext.drawImage(element.img, element.x, element.y, element.width, element.height);
            });
            
            // Re-draw all drawing elements
            drawingElements.forEach(element => {
                // In a real implementation, you'd replay the drawing paths
            });
        }

        function changeZoom(delta) {
            scale += delta;
            scale = Math.max(0.5, Math.min(3, scale));
            zoomLevel.textContent = Math.round(scale * 100) + '%';
            renderPage(currentPage);
        }

        function fitToPageView() {
            const containerWidth = canvasContainer.clientWidth - 40;
            const canvasWidth = pdfCanvas.width / scale;
            const newScale = containerWidth / canvasWidth;
            
            scale = Math.max(0.5, Math.min(3, newScale));
            zoomLevel.textContent = Math.round(scale * 100) + '%';
            renderPage(currentPage);
        }

        async function downloadEditedPDF() {
            showLoading('Generating edited PDF...');
            
            try {
                // Get the canvas data
                const imageData = pdfCanvas.toDataURL('image/png');
                
                // If we have OCR edits, try to reconstruct PDF
                if (isOcrMode && ocrTextBlocks.some(block => block.edited)) {
                    await reconstructPDFWithEdits(imageData);
                } else {
                    // For now, we'll just download the canvas as an image
                    const link = document.createElement('a');
                    link.download = 'edited_page_' + currentPage + '.png';
                    link.href = imageData;
                    link.click();
                }
                
                hideLoading();
                
            } catch (error) {
                console.error('Error generating PDF:', error);
                hideLoading();
                alert('Error generating PDF. Please try again.');
            }
        }

        function resetEditor() {
            if (confirm('Are you sure you want to start over? All changes will be lost.')) {
                textElements = [];
                imageElements = [];
                drawingElements = [];
                undoStack = [];
                redoStack = [];
                renderPage(currentPage);
            }
        }

        function showLoading(text, subtext = '') {
            loadingText.textContent = text;
            loadingSubtext.textContent = subtext || 'Please wait...';
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        // OCR Functions
        async function extractTextWithOCR() {
            if (!pdfDoc) {
                alert('Please upload a PDF first');
                return;
            }
            
            showLoading('Extracting text...', 'Using OCR to find text in your PDF');

            try {
                // Get the original PDF file (we need to re-upload it for OCR)
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.pdf';

                input.onchange = async function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        await processOCR(file);
                    }
                };

                input.click();
                
            } catch (error) {
                console.error('OCR error:', error);
                hideLoading();
                alert('Error extracting text. Please try again.');
            }
        }

        async function processOCR(file) {
            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(`${config.backendUrl}/api/ocr-pdf-text`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'OCR failed');
                }

                const result = await response.json();

                if (result.success) {
                    ocrTextBlocks = result.textBlocks;
                    isOcrMode = true;
                    createEditableTextBoxes(ocrTextBlocks);
                    hideLoading();
                    alert(`Found ${ocrTextBlocks.length} text blocks! Click on any text to edit it.`);
                } else {
                    throw new Error(result.error || 'OCR failed');
                }

            } catch (error) {
                console.error('OCR processing error:', error);
                hideLoading();
                alert('Error processing OCR. Please try again.');
            }
        }

        function createEditableTextBoxes(textBlocks) {
            // Clear existing boxes
            ocrTextContainer.innerHTML = '';

            textBlocks.forEach((block, index) => {
                const textBox = document.createElement('div');
                textBox.className = 'editable-text-box';
                textBox.dataset.index = index;

                // Position based on PDF coordinates (scaled)
                const scaledX = (block.X || 0) * scale;
                const scaledY = (block.Y || 0) * scale;
                const scaledWidth = (block.Width || 100) * scale;
                const scaledHeight = (block.Height || 20) * scale;

                textBox.style.left = scaledX + 'px';
                textBox.style.top = scaledY + 'px';
                textBox.style.width = Math.max(scaledWidth, 100) + 'px';
                textBox.style.minHeight = Math.max(scaledHeight, 30) + 'px';

                // Confidence indicator
                const confidence = block.Confidence || 0;
                let confidenceClass = 'confidence-low';
                if (confidence > 0.8) confidenceClass = 'confidence-high';
                else if (confidence > 0.6) confidenceClass = 'confidence-medium';

                textBox.innerHTML = `
                    <div class="editable-text-controls">
                        <button class="text-control-btn save-text" onclick="saveOcrText(${index})">✓</button>
                        <button class="text-control-btn cancel-text" onclick="cancelOcrEdit(${index})">✕</button>
                    </div>
                    <textarea class="editable-text-input" onfocus="selectOcrTextBox(${index})">${block.Text || ''}</textarea>
                    <div class="confidence-indicator ${confidenceClass}">
                        ${Math.round(confidence * 100)}%
                    
    <!-- FAQ Section -->
    <section class="faq-section">
        <h2>Frequently Asked Questions about Edit Pdf</h2>
        <div class="faq-grid">
            
                <div class="faq-item">
                    <h3>Is PDFIndi free to use?</h3>
                    <p>Yes, all our tools are 100% free with no hidden charges or premium subscriptions.</p>
                </div>
                <div class="faq-item">
                    <h3>Are my files secure with PDFIndi?</h3>
                    <p>Absolutely. Most of our tools process files directly in your browser. Even for tools that require server-side logic, we never store or read your documents. Your privacy is our priority.</p>
                </div>
                <div class="faq-item">
                    <h3>Do I need to sign up or create an account?</h3>
                    <p>No registration is required. You can use any of our PDF or Image tools instantly without providing an email address.</p>
                </div>
        </div>
    </section>
    </div>
                `;

                // Make draggable
                makeDraggable(textBox);

                ocrTextContainer.appendChild(textBox);
                editableTextBoxes.push(textBox);
            });
        }

        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, startLeft, startTop;

            element.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseInt(element.style.left);
                startTop = parseInt(element.style.top);
                element.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                element.style.left = (startLeft + dx) + 'px';
                element.style.top = (startTop + dy) + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.cursor = 'move';
                }
            });
        }

        function selectOcrTextBox(index) {
            // Remove selected class from all boxes
            editableTextBoxes.forEach(box => box.classList.remove('selected'));

            // Add selected class to current box
            if (editableTextBoxes[index]) {
                editableTextBoxes[index].classList.add('selected');
            }
        }

        function saveOcrText(index) {
            const textBox = editableTextBoxes[index];
            if (textBox) {
                const textarea = textBox.querySelector('.editable-text-input');
                const newText = textarea.value;

                // Update the OCR text block
                if (ocrTextBlocks[index]) {
                    ocrTextBlocks[index].Text = newText;
                    ocrTextBlocks[index].edited = true;
                }

                textBox.classList.remove('selected');
                alert('Text saved! You can download the edited PDF when ready.');
            }
        }

        function cancelOcrEdit(index) {
            const textBox = editableTextBoxes[index];
            if (textBox) {
                const textarea = textBox.querySelector('.editable-text-input');

                // Restore original text
                if (ocrTextBlocks[index]) {
                    textarea.value = ocrTextBlocks[index].Text || '';
                }

                textBox.classList.remove('selected');
            }
        }

        // Initialize zoom level display
        zoomLevel.textContent = Math.round(scale * 100) + '%';

        async function reconstructPDFWithEdits(imageData) {
            try {
                // Get the original PDF file for reconstruction
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.pdf';

                input.onchange = async function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('textEdits', JSON.stringify(ocrTextBlocks));

                        const response = await fetch(`${config.backendUrl}/api/reconstruct-pdf`, {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error('PDF reconstruction failed');
                        }

                        const result = await response.json();

                        // Download the reconstructed PDF
                        const byteCharacters = atob(result.base64);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray], { type: 'application/pdf' });

                        const link = document.createElement('a');
                        link.href = window.URL.createObjectURL(blob);
                        link.download = result.filename || 'edited_pdf.pdf';
                        link.click();

                        window.URL.revokeObjectURL(link.href);
                    }
                };

                input.click();

            } catch (error) {
                console.error('PDF reconstruction error:', error);
                // Fallback to image download
                const link = document.createElement('a');
                link.download = 'edited_page_' + currentPage + '.png';
                link.href = imageData;
                link.click();
            }
        }
    </script>
