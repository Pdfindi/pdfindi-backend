<!DOCTYPE html>
<html lang="en">
<head>

    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-WWZRMF4W');</script>
    <!-- End Google Tag Manager -->
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit PDF (BETA) - PDFINDI</title>
    <meta name="description" content="Free online Edit PDF tool. 100% free, no sign-up required. Fast, secure, and made in India.">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.min.css">
    <link rel="stylesheet" href="../modern-header.min.css">
    
    <!-- PDF.js for PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- pdf-lib for PDF editing -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <link rel="stylesheet" href="tool-styles.css">
    
    <script>
        // Local configuration for the editor
        const config = {
            backendUrl: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                ? '' 
                : 'https://pdfindi-backend.onrender.com'
        };
    </script>

    <link rel="canonical" href="https://pdfindi.com/tools/edit-pdf">
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WWZRMF4W"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    
    <div class="tool-page">
        <!-- Back Button -->
        <a href="/#pdf-tools-section" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to PDF Tools
        </a>
        
        <!-- Tool Header -->
        <div class="tool-header">
            <div class="tool-icon">✏️</div>
            <h1>Edit PDF <span class="beta-badge">BETA</span></h1>
            <p>Modify text, add images, and annotate your PDF documents professionally.</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Upload Section -->
            <div class="upload-section">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📄</div>
                    <h3>Upload PDF to Edit</h3>
                    <p>Drop your PDF file here or click to browse<br><small>Maximum file size: 50MB</small></p>
                    <input type="file" id="pdfInput" accept=".pdf" style="display: none;">
                </div>
            </div>

            <!-- Editor Container -->
            <div class="editor-container" id="editorContainer" style="display: none;">
                <!-- Toolbar -->
                <div class="editor-toolbar">
                    <button class="tool-btn" id="textTool" title="Add New Text">
                        <span>📝</span> Text
                    </button>
                    <button class="tool-btn" id="imageTool" title="Add Image">
                        <span>🖼️</span> Image
                    </button>
                    <button class="tool-btn" id="drawTool" title="Draw">
                        <span>✏️</span> Draw
                    </button>
                    <button class="tool-btn" id="highlightTool" title="Highlight">
                        <span>🟡</span> Highlight
                    </button>
                    <button class="tool-btn" id="ocrTool" title="Enable Text Editing">
                        <span>🔍</span> Edit Existing Text
                    </button>
                    
                    <div style="border-left: 1px solid #ddd; height: 24px; margin: 0 10px;"></div>
                    
                    <button class="tool-btn" id="undoBtn" title="Undo">
                        <span>↶</span>
                    </button>
                    <button class="tool-btn" id="redoBtn" title="Redo">
                        <span>↷</span>
                    </button>

                    <div class="zoom-controls">
                        <button class="tool-btn" id="zoomOut"><span>−</span></button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button class="tool-btn" id="zoomIn"><span>+</span></button>
                        <button class="tool-btn" id="fitToPage">Fit</button>
                    </div>
                </div>

                <!-- Canvas Container -->
                <div class="canvas-container" id="canvasContainer">
                    <!-- PDF pages rendered here -->
                </div>

                <!-- Action Bar -->
                <div class="action-bar">
                    <button class="btn btn-secondary" id="resetBtn">Start Over</button>
                    <button class="btn btn-primary" id="downloadBtn">Save & Download PDF</button>
                </div>
            </div>
        </div>

        <!-- Floating Text Editor (absolute positioned via JS) -->
        <div class="text-editor" id="textEditor" style="display: none; position: absolute; z-index: 1000; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid #ddd;">
            <textarea style="width: 200px; height: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; margin-bottom: 8px; display: block;"></textarea>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button class="cancel" style="padding: 4px 12px; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button class="save" style="padding: 4px 12px; border: none; background: #fa7220; color: white; border-radius: 4px; cursor: pointer; font-weight: 600;">Save</button>
            </div>
        </div>

        <!-- OCR Layer -->
        <div class="ocr-text-container" id="ocrTextContainer"></div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <h3 id="loadingText">Processing...</h3>
            <p id="loadingSubtext">Please wait while we prepare your document</p>
        </div>
    </div>

    <script src="js/edit-pdf.js" defer></script>
    <script src="../modern-header.min.js"></script>
</body>
</html>
