    <style>
        .tool-page {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .tool-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .tool-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FF9933, #138808);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tool-header h1 {
            font-size: 2.5rem;
            color: #212529;
            margin-bottom: 1rem;
        }
        
        .tool-header p {
            font-size: 1.1rem;
            color: #6c757d;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #FF9933;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .back-btn:hover {
            color: #138808;
            background: #fff5f5;
            transform: translateX(-5px);
        }
        
        .password-display {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
            transition: all 0.3s;
        }
        
        .password-display:focus-within {
            border-color: #FF9933;
            box-shadow: 0 0 0 3px rgba(217, 35, 45, 0.1);
        }
        
        .password-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.5rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            border: none;
            background: transparent;
            color: #212529;
            font-weight: 600;
            letter-spacing: 2px;
        }
        
        .password-input:focus {
            outline: none;
        }
        
        .password-input::placeholder {
            color: #adb5bd;
            font-size: 1rem;
            letter-spacing: normal;
        }
        
        .strength-indicator {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }
        
        .strength-weak { background: #f8d7da; color: #721c24; }
        .strength-medium { background: #fff3cd; color: #856404; }
        .strength-strong { background: #d1ecf1; color: #0c5460; }
        .strength-very-strong { background: #d4edda; color: #155724; }
        
        .controls-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .control-group label {
            font-weight: 600;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #dee2e6;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #FF9933;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            background: #138808;
            transform: scale(1.1);
        }
        
        .control-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #FF9933;
        }
        
        .length-display {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #FF9933;
            margin-top: 0.5rem;
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .red-button {
            background: #FF9933;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 140px;
            justify-content: center;
        }
        
        .red-button:hover {
            background: #138808;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 35, 45, 0.3);
        }
        
        .red-button.secondary {
            background: #6c757d;
        }
        
        .red-button.secondary:hover {
            background: #5a6268;
        }
        
        .red-button:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .copy-feedback.show {
            transform: translateX(0);
        }
        
        .footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 4rem;
            border-radius: 12px;
        }
        
        .footer-links {
            margin-bottom: 1rem;
        }
        
        .footer-links a {
            color: #00c3ff;
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.2s ease;
        }
        
        .footer-links a:hover {
            color: #fff;
        }
        
        .footer-copyright {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .tool-page {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .tool-header h1 {
                font-size: 2rem;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            .red-button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Password Generator",
  "description": "Generate strong, secure passwords with customizable options.",
  "url": "https://pdfindi.com/tools/password-generator.html",
  "applicationCategory": "Security Tool",
  "operatingSystem": "Any",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "INR"
  },
  "provider": {
    "@type": "Organization",
    "name": "PDFINDI",
    "url": "https://pdfindi.com"
  }
}
</script>

</head>
<body>
    <div class="tool-page">
        <a href="../index.html#utility-tools-section" class="back-btn" id="back-to-tools-btn">
            ← Back to Tools
        </a>
        
        <div class="tool-header">
            <div class="tool-icon">🔐</div>
            <h1>Password Generator</h1>
            <p>Create strong, secure passwords with customizable options. Generate passwords that are hard to crack but easy to remember.</p>
        </div>

        <div class="password-display">
            <input type="text" id="password-output" class="password-input" readonly placeholder="Your password will appear here...">
            <div id="strength-indicator" class="strength-indicator" style="display: none;"></div>
        </div>

        <div class="controls-section">
            <div class="controls-grid">
                <div class="control-group">
                    <label for="password-length">
                        <span>📏</span>
                        Password Length: <span id="length-value">16</span>
                    </label>
                    <input type="range" id="password-length" min="8" max="64" value="16">
                    <div class="length-display" id="length-display">16 characters</div>
                </div>
                
                <div class="control-group">
                    <label for="include-uppercase">
                        <span>🔠</span>
                        <input type="checkbox" id="include-uppercase" checked>
                        Include Uppercase Letters (A-Z)
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="include-lowercase">
                        <span>🔡</span>
                        <input type="checkbox" id="include-lowercase" checked>
                        Include Lowercase Letters (a-z)
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="include-numbers">
                        <span>🔢</span>
                        <input type="checkbox" id="include-numbers" checked>
                        Include Numbers (0-9)
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="include-symbols">
                        <span>🔣</span>
                        <input type="checkbox" id="include-symbols" checked>
                        Include Symbols (!@#$%^&*)
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="exclude-similar">
                        <span>🚫</span>
                        <input type="checkbox" id="exclude-similar">
                        Exclude Similar Characters (l, 1, I, O, 0)
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button id="generate-btn" class="red-button">
                    <span>🎲</span>
                    Generate Password
                </button>
                <button id="copy-btn" class="red-button secondary" disabled>
                    <span>📋</span>
                    Copy Password
                </button>
                <button id="refresh-btn" class="red-button secondary">
                    <span>🔄</span>
                    Refresh
                </button>
            </div>
        </div>
        
        <div class="footer">
            <div class="footer-links">
                <a href="../about.html">About</a>
                <a href="../privacy.html">Privacy</a>
                <a href="../contact.html">Contact</a>
                <a href="../faq.html">FAQ</a>
            </div>
            <div class="footer-copyright">
                © 2024 PDFINDI. All rights reserved. Made with ❤️ for India.
            </div>
        </div>
    </div>

    <div id="copy-feedback" class="copy-feedback">Password copied to clipboard!</div>

    <script>
        // Password Generator functionality
        const passwordOutput = document.getElementById('password-output');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const lengthSlider = document.getElementById('password-length');
        const lengthValue = document.getElementById('length-value');
        const lengthDisplay = document.getElementById('length-display');
        const strengthIndicator = document.getElementById('strength-indicator');
        const copyFeedback = document.getElementById('copy-feedback');
        
        // Character sets
        const charSets = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?',
            similar: 'l1IO0'
        };
        
        // Update length display
        function updateLengthDisplay() {
            const length = lengthSlider.value;
            lengthValue.textContent = length;
            lengthDisplay.textContent = `${length} character${length > 1 ? 's' : ''}`;
        }
        
        // Calculate password strength
        function calculateStrength(password) {
            let score = 0;
            
            if (password.length >= 8) score += 1;
            if (password.length >= 12) score += 1;
            if (password.length >= 16) score += 1;
            
            if (/[A-Z]/.test(password)) score += 1;
            if (/[a-z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;
            
            if (score <= 2) return { level: 'weak', class: 'strength-weak', text: 'Weak Password' };
            if (score <= 4) return { level: 'medium', class: 'strength-medium', text: 'Medium Password' };
            if (score <= 6) return { level: 'strong', class: 'strength-strong', text: 'Strong Password' };
            return { level: 'very-strong', class: 'strength-very-strong', text: 'Very Strong Password' };
        }
        
        // Generate password
        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            const includeUppercase = document.getElementById('include-uppercase').checked;
            const includeLowercase = document.getElementById('include-lowercase').checked;
            const includeNumbers = document.getElementById('include-numbers').checked;
            const includeSymbols = document.getElementById('include-symbols').checked;
            const excludeSimilar = document.getElementById('exclude-similar').checked;
            
            // Build character set
            let chars = '';
            if (includeUppercase) chars += charSets.uppercase;
            if (includeLowercase) chars += charSets.lowercase;
            if (includeNumbers) chars += charSets.numbers;
            if (includeSymbols) chars += charSets.symbols;
            
            if (chars === '') {
                alert('Please select at least one character type!');
                return;
            }
            
            // Remove similar characters if requested
            if (excludeSimilar) {
                chars = chars.split('').filter(char => !charSets.similar.includes(char)).join('');
            }
            
            // Generate password
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            // Ensure at least one character from each selected type
            if (includeUppercase && !/[A-Z]/.test(password)) {
                password = password.slice(0, -1) + charSets.uppercase.charAt(Math.floor(Math.random() * charSets.uppercase.length));
            }
            if (includeLowercase && !/[a-z]/.test(password)) {
                password = password.slice(0, -1) + charSets.lowercase.charAt(Math.floor(Math.random() * charSets.lowercase.length));
            }
            if (includeNumbers && !/[0-9]/.test(password)) {
                password = password.slice(0, -1) + charSets.numbers.charAt(Math.floor(Math.random() * charSets.numbers.length));
            }
            if (includeSymbols && !/[^A-Za-z0-9]/.test(password)) {
                password = password.slice(0, -1) + charSets.symbols.charAt(Math.floor(Math.random() * charSets.symbols.length));
            }
            
            passwordOutput.value = password;
            copyBtn.disabled = false;
            
            // Show strength indicator
            const strength = calculateStrength(password);
            strengthIndicator.className = `strength-indicator ${strength.class}`;
            strengthIndicator.textContent = strength.text;
            strengthIndicator.style.display = 'block';
        }
        
        // Copy to clipboard
        function copyToClipboard() {
            if (passwordOutput.value) {
                navigator.clipboard.writeText(passwordOutput.value).then(() => {
                    copyFeedback.classList.add('show');
                    setTimeout(() => {
                        copyFeedback.classList.remove('show');
                    }, 2000);
                }).catch(() => {
                    alert('Failed to copy password. Please select and copy manually.');
                });
            }
        }
        
        // Event listeners
        lengthSlider.addEventListener('input', updateLengthDisplay);
        generateBtn.addEventListener('click', generatePassword);
        copyBtn.addEventListener('click', copyToClipboard);
        refreshBtn.addEventListener('click', generatePassword);
        
        // Initialize
        updateLengthDisplay();
        generatePassword(); // Generate initial password
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    generatePassword();
                } else if (e.key === 'c' && !copyBtn.disabled) {
                    e.preventDefault();
                    copyToClipboard();
                }
            }
        });
        
        // Back to Tools button functionality
        document.getElementById('back-to-tools-btn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../index.html#utility-tools-section';
        });
    </script>
    <script src="../modern-header.js"></script>
</body>
</html>
